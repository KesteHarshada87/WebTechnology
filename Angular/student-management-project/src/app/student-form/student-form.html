<h2>Add Student</h2>

<div class="form">
  <input [(ngModel)]="student.name" placeholder="Name" class="input">
  <input [(ngModel)]="student.age" placeholder="Age" class="input">
  <input [(ngModel)]="student.course" placeholder="Course" class="input">

  <button class="add" (click)="addStudent()">Add Student</button>
</div>
