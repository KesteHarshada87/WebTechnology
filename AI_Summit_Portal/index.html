<!DOCTYPE html>
<html>
<head>
    <title>AI Summit India 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🇮🇳 AI Summit India - 22 Feb 2026</h1>
    <button id="innovationBtn">View India's AI Innovations</button>
</header>

<!-- HOME SECTION -->
<section id="homeSection">
    <h2>Top Voices at AI Summit</h2>
    <div id="speakerContainer" class="card-container"></div>

    <!-- Speech Section -->
    <div id="speechSection" style="margin-top:50px; display:none;">
        <h2 id="speechTitle"></h2>
        <p id="speechText" class="speech-box"></p>
    </div>
</section>

<!-- INNOVATION SECTION -->
<section id="innovationSection" style="display:none;">
    <h2>🚀 Major AI Innovations of India</h2>
    <div id="innovationContainer" class="card-container"></div>

    <h2 style="margin-top:60px;">🇮🇳 Prominent Indian AI Apps</h2>
    <div id="appContainer" class="card-container"></div>

    <button id="backBtn">⬅ Back to Speakers</button>
</section>

<script src="script.js"></script>
</body>
</html>
